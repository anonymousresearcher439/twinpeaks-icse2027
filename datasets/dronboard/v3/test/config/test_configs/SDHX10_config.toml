# These are permanent configuration details that don't change run-to-run
name = "Polkadot"
system_id = 1 # this is the MAVLink system ID

[mqtt]
# The ground control MQTT server
host = "mqtt"
port = 1883

[mqtt_local]
# The local MQTT server
host = "mqtt_local"
port = 1883

[fcu]
# Flight control unit
# type: "ardupilot" | "px4"
type = "px4"

[gimbal]
pitch = -45.0
roll = 0
yaw = 0
# type: "gremsy" | "mavlink_gimbal_manager" | "fixed_camera"
type = "fixed_camera"

[camera]
# The field of view of the camera in degrees
horizontal_fov = 74
vertical_fov = 42

