name: dr-onboard-autonomy

x-extends-mqtt: &mqtt-extends
  file: ../common.yaml
  service: mqtt_local

x-extends-roscore: &roscore-extends
  file: ../common.yaml
  service: roscore

x-extends-mavros: &mavros-extends
  file: ../common.yaml
  service: mavros

x-extends-ardupilot: &ardupilot-extends
  file: ../common.yaml
  service: ardupilot


services:
  mqtt_local:
    extends: *mqtt-extends

  roscore:
    extends: *roscore-extends

  mavros:
    extends: *mavros-extends
    command:
      - "/bin/start_mavros.sh"
      - "tcp://ardupilot:5762"
    depends_on:
      - roscore
      - ardupilot
  
  ardupilot:
    extends: *ardupilot-extends

  drone:
    extends:
      file: ../common.yaml
      service: dr-onboard-autonomy
    volumes:
      - ./scripts/start-state-machine.sh:/catkin_ws/start-state-machine.sh
      - ../../test/config/config.toml:/etc/dr/config.toml
      - ../..:/catkin_ws/src/dr_onboard_autonomy:cached
    depends_on:
      - mavros
      - mqtt_local
      - roscore
      - ardupilot
    command: ./start-state-machine.sh
