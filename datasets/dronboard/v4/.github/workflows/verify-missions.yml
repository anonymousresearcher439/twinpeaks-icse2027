name: 🔧 Verify Mission Initialization
on: [push]

jobs:
  verify-missions:
    runs-on: [self-hosted]
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v4

      - name: Build docker images
        run: docker compose -f ./docker/tests-compose.yaml build
        env:
          TERRAIN_DATA_DIR: /tmp/terrain

      - name: Run Mission Verification Tests
        run: docker compose -f ./docker/tests-compose.yaml run gh_actions_unit_tests ./scripts/verify_all_missions.bash
        env:
          TERRAIN_DATA_DIR: /tmp/terrain